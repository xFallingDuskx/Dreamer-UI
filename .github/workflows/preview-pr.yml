name: Hosting Preview on Pull Request
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install library dependencies
        working-directory: lib
        run: npm ci

      - name: Build library
        working-directory: lib
        run: npm run build

      - name: Pack library
        id: pack
        working-directory: lib
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          echo "path=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        working-directory: app
        run: |
          npm ci
          npm install --no-save "${{ steps.pack.outputs.path }}"

      - name: Build app
        working-directory: app
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DREAMERUI }}
          projectId: dreamerui
          entryPoint: app
