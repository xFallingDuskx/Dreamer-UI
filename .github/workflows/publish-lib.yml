name: Release Library and Deploy App

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'app/**'

concurrency:
  group: release-library-and-deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_NAME: '@moondreamsdev/dreamer-ui'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Detect changed packages
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            lib_changed=true
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- lib; then
            lib_changed=false
          else
            lib_changed=true
          fi

          echo "lib=$lib_changed" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release
        env:
          LIB_CHANGED: ${{ steps.changes.outputs.lib }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const packageName = process.env.PACKAGE_NAME;
          const registryName = encodeURIComponent(packageName);
          const response = await fetch(`https://registry.npmjs.org/${registryName}`);

          if (!response.ok) {
            throw new Error(`Registry request failed with ${response.status}`);
          }

          const metadata = await response.json();
          const latest = metadata['dist-tags']?.latest;

          if (!latest) {
            throw new Error('The npm registry did not return a latest version');
          }

          let version = latest;
          let publish = false;

          if (process.env.LIB_CHANGED === 'true') {
            const existing = Object.entries(metadata.versions)
              .filter(([candidate, manifest]) =>
                /^\d+\.\d+\.\d+$/.test(candidate) && manifest.gitHead === process.env.GITHUB_SHA
              )
              .map(([candidate]) => candidate)
              .sort((left, right) => {
                const a = left.split('.').map(Number);
                const b = right.split('.').map(Number);
                return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              })
              .at(-1);

            if (existing) {
              version = existing;
            } else {
              const match = latest.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if (!match) {
                throw new Error(`Cannot derive a patch version from ${latest}`);
              }

              version = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
              publish = true;
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\npublish=${publish}\n`);
          NODE

      - name: Install library dependencies
        if: steps.changes.outputs.lib == 'true'
        working-directory: lib
        run: npm ci

      - name: Set release version
        if: steps.release.outputs.publish == 'true'
        working-directory: lib
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version

      - name: Build library
        if: steps.changes.outputs.lib == 'true'
        working-directory: lib
        run: npm run build

      - name: Publish library
        if: steps.release.outputs.publish == 'true'
        working-directory: lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Wait for exact registry version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in {1..12}; do
            published=$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null || true)
            latest=$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || true)

            if [[ "$published" == "$VERSION" && "$latest" == "$VERSION" ]]; then
              exit 0
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for $PACKAGE_NAME@$VERSION"
          exit 1

      - name: Check deployment freshness
        id: freshness
        shell: bash
        run: |
          git fetch origin master

          if [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer master commit exists; its queued run will deploy instead."
          fi

      - name: Install app dependencies
        if: steps.freshness.outputs.current == 'true'
        working-directory: app
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm install --no-save "$PACKAGE_NAME@$VERSION"

      - name: Build app
        if: steps.freshness.outputs.current == 'true'
        working-directory: app
        run: npm run build

      - name: Deploy app
        if: steps.freshness.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DREAMERUI }}
          channelId: live
          projectId: dreamerui
          entryPoint: app

      - name: Report deployed version
        if: steps.freshness.outputs.current == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Deployed $PACKAGE_NAME@$VERSION" >> "$GITHUB_STEP_SUMMARY"
